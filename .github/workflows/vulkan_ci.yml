name: Vulkan Compute CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslang-tools libglm-dev cmake ninja-build
      - name: Build C++ Compute Engine
        run: |
          cd vulkan_compute
          mkdir build && cd build
          cmake -G Ninja ..
          ninja
